name: townsy
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  geolocator: ^14.0.2
  geocoding: ^3.0.0
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf



    - family: Harmattan
      fonts:
        - asset: assets/fonts/Harmattan-Regular.ttf

    - family: Harmattan_B
      fonts:
        - asset: assets/fonts/Harmattan-Bold.ttf